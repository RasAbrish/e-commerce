version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bright-ideas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bright_ideas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bright-ideas-api
    environment:
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/bright_ideas_db?schema=public"
      JWT_SECRET: "docker-super-secret-access-token-key-2026"
      JWT_REFRESH_SECRET: "docker-super-secret-refresh-token-key-2026"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: bright-ideas-web
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
